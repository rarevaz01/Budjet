<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
:root{--bg:#0A041A;--card:#150B2E;--line:#251643;--text:#F4F2F8;--muted:#9A8FBA;--accent:#F79009;--btn-text:#0A041A;--white-seg:#F4F2F8;--track:#251643}
[data-theme="light"]{--bg:#F5F3FA;--card:#ffffff;--line:#E5E1EF;--text:#0A041A;--muted:#7C7391;--accent:#F79009;--btn-text:#0A041A;--white-seg:#DAD5E6;--track:#E5E1EF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}
body{padding:20px 14px;display:flex;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 16px;width:100%;max-width:560px}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
h1{font-weight:800;font-size:26px;margin:0}
.month-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.month-select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font-weight:700;font-size:14px;padding:9px 10px;flex:1;min-width:0}
.month-add{background:#FFD400;color:#1A1400;border:none;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;flex-shrink:0;white-space:nowrap}
.month-del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#status{font-size:11px;color:var(--muted)}
#status.err{color:#e57373}
.chart-col{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.chart-svg-wrap{flex-shrink:0}
.chart-side{display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
.side-block{display:flex;flex-direction:column;gap:4px}
.side-label{font-size:12px;color:var(--muted)}
.side-value{font-size:20px;font-weight:800;color:var(--text);padding:6px 0}
.income-row{display:flex;gap:6px}
.income-input{background:rgba(109,199,134,.12);border:1px solid #6DC786;border-radius:8px;color:var(--text);font-size:12px;padding:8px 8px;width:0;min-width:0;flex:1;display:none;text-align:center}
.income-input.show{display:block}
.income-input::placeholder{color:#a8d99a}
.income-btn{background:#6DC786;border:none;color:var(--btn-text);font-weight:700;font-size:12px;padding:8px 10px;border-radius:8px;flex-shrink:0;white-space:nowrap}
.income-comment{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:8px 8px;width:100%;margin-top:6px;display:none;text-align:center}
.income-comment.show{display:block}
.income-comment::placeholder{color:var(--muted);font-weight:700}
.side-value.neg{color:#e57373}
svg{overflow:visible}
.binp{background:none;border:none;color:var(--text);font-weight:800;font-size:20px;padding:6px 0;width:100%;max-width:150px;cursor:default}
.binp:focus{outline:none}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row-top{display:grid;grid-template-columns:20px 12px minmax(0,1fr) 82px 44px 22px;align-items:center;gap:6px}
.move-col{display:flex;flex-direction:column;gap:1px}
.drag-handle{background:none;border:none;color:var(--muted);width:24px;height:32px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;font-size:18px;letter-spacing:-2px}
.row-dragging{opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.3);border-radius:14px;background:var(--card);pointer-events:none}
.row-spacer{border:2px dashed var(--line);border-radius:12px;margin:2px 0;box-sizing:border-box}
.sw{width:10px;height:10px;border-radius:3px}
.ninp{background:transparent;border:none;color:var(--text);font-weight:600;font-size:12px;text-transform:uppercase;width:100%;min-width:0;padding:3px 2px}
.amt-display{font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.pct{font-size:10px;color:var(--muted);text-align:right}
.del{background:none;border:none;color:var(--muted);font-size:15px;width:22px;height:22px;border-radius:6px}
.row-bottom{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.plus-input{background:rgba(109,199,134,.12);border:1px solid #6DC786;border-radius:10px;color:var(--text);font-size:13px;padding:9px 10px;width:0;min-width:0;height:40px;text-align:center;display:none;flex:1}
.plus-input.show{display:block}
.plus-input::placeholder{color:#a8c9b4}
.comment-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:12px;padding:9px 10px;flex:1;min-width:0;height:40px;text-align:center}
.comment-input::placeholder{color:var(--muted);font-weight:700}
.plus-row{display:flex;align-items:center;gap:6px;width:100%}
.plus-btn{background:#6DC786;border:none;color:var(--btn-text);font-weight:800;font-size:18px;width:100%;height:40px;border-radius:10px;flex-shrink:0;transition:width .15s ease}
.plus-btn.compact{width:40px}
.hist-toggle-row{display:flex;justify-content:flex-start}
.comment-row{display:flex;align-items:center;gap:6px}
.hist-icon-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.hist-icon-badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#1A1400;font-size:9px;font-weight:800;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.hist-toggle{background:none;border:none;color:var(--muted);font-size:10px;text-decoration:underline;padding:2px 4px;flex-shrink:0}
.hist{margin-top:6px;padding-left:18px;display:none}
.hist.open{display:block}
.hist-item{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--muted);padding:6px 0}
.hist-item .hist-top{display:flex;gap:10px;align-items:center}
.hist-item b{color:var(--text);font-weight:600;font-size:14px}
.hist-item .hist-comment{color:var(--muted);font-size:13px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;cursor:pointer}
.hist-item .hist-comment.expanded{white-space:normal;overflow:visible;text-overflow:clip}
.hist-del{background:none;border:none;color:var(--muted);font-size:13px;width:20px;height:20px;border-radius:5px;margin-left:auto;flex-shrink:0}
.add{margin-top:12px;background:#FFD400;border:none;color:#1A1400;font-weight:700;font-size:13px;padding:11px 12px;border-radius:12px;width:100%;text-align:center}
.bottom-row{display:flex;gap:8px;margin-top:10px}
.head-icons{display:flex;align-items:center;gap:8px}
.icon-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:85vh;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-size:18px;font-weight:800;margin:0}
.gh-tags{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.gh-tag{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:7px 12px;border-radius:20px}
.gh-tag.active{background:var(--accent);color:var(--btn-text);border-color:var(--accent)}
.sheet-close{background:none;border:none;color:var(--muted);font-size:20px;width:32px;height:32px}
.sheet-export{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.gh-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
.gh-item{border-bottom:1px solid var(--line);padding:10px 0}
.gh-row{display:flex;align-items:center;gap:8px}
.gh-sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.gh-cat{font-size:11px;color:var(--muted);text-transform:uppercase;flex-shrink:0}
.gh-date{font-size:11px;color:var(--muted)}
.gh-editrow{display:flex;align-items:center;gap:6px;margin-top:6px}
.gh-amt-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-weight:700;font-size:13px;padding:6px 8px;width:90px;text-align:center}
.gh-comment-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 8px;flex:1;min-width:0}
.gh-save{background:#6DC786;border:none;color:var(--btn-text);font-weight:700;font-size:12px;padding:7px 10px;border-radius:8px;flex-shrink:0}
.gh-del{background:none;border:none;color:var(--muted);font-size:14px;width:26px;height:26px;border-radius:6px;flex-shrink:0}
.gh-edit-icon{font-size:20px;font-weight:700;width:32px;height:32px}
.gh-restore{background:none;border:1px solid #6DC786;color:#6DC786;font-weight:700;font-size:12px;padding:7px 12px;border-radius:8px}
</style></head><body><div class="card">
<div class="head">
  <h1>Бюджет</h1>
  <div class="head-icons">
    <span id="status"></span>
    <button class="icon-btn" id="openGlobalHist" title="История" aria-label="История">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" title="Тема" aria-label="Переключить тему">
      <svg id="themeIconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg id="themeIconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>
</div>
<div class="month-row">
  <select class="month-select" id="monthSelect"></select>
  <button class="month-add" id="newMonthBtn">Новый месяц</button>
  <button class="month-add" id="newCustomMonthBtn" title="Создать период со своим названием">Своё название</button>
  <button class="month-del" id="delMonthBtn" title="Удалить месяц" aria-label="Удалить месяц">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
  </button>
</div>
<div class="chart-col">
  <div class="chart-svg-wrap"><svg id="donut" width="180" height="180" viewBox="0 0 300 300"></svg></div>
  <div class="chart-side">
    <div class="side-block">
      <span class="side-label">Бюджет</span>
      <input class="binp" id="bi" type="text" inputmode="decimal" value="0" readonly>
    </div>
    <div class="side-block">
      <span class="side-label">Остаток</span>
      <span class="side-value" id="ld">-</span>
    </div>
    <div class="side-block">
      <form class="income-row" id="incomeForm">
        <input class="income-input" id="incomeAmt" type="text" inputmode="decimal" placeholder="сумма дохода">
        <button class="income-btn" type="button" id="incomeBtn">Доход</button>
      </form>
      <input class="income-comment" id="incomeComment" type="text" placeholder="комментарий">
    </div>
  </div>
</div>
<div id="rows"></div>
<button class="add" id="addRow">Добавить категорию</button>
</div>
<div class="overlay" id="ghOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>История</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="sheet-export" id="ghExport" title="Выгрузить в Excel" aria-label="Выгрузить в Excel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button class="sheet-close" id="ghClose">×</button>
      </div>
    </div>
    <div class="gh-tags">
      <button class="gh-tag active" data-ghtag="all">Все</button>
      <button class="gh-tag" data-ghtag="expense">Траты</button>
      <button class="gh-tag" data-ghtag="income">Доходы</button>
      <button class="gh-tag" data-ghtag="other">Другое</button>
    </div>
    <div id="ghList"></div>
  </div>
</div>
<script>
const P=["#3382F9","#F79009","#6DC786","#6699F5","#F7A83D","#8ED2A0","#1E5FC7","#C06F00","#3F8F56","#B8D0FB","#FBCE94","#C3E8CD"];
function nextColor(existingCategories){
  const used = (existingCategories||[]).map(c=>c.col).filter(Boolean);
  for(const c of P){ if(!used.includes(c)) return c; }
  return P[(existingCategories||[]).length % P.length];
}
const K="icity-budget-v2";
const MONTH_NAMES=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){
  const month = STORE.months[key];
  if(month && month.customName) return month.customName;
  const parts = key.split('-');
  if(parts.length===2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])){
    const y = +parts[0], m = +parts[1];
    return MONTH_NAMES[m-1]+' '+y;
  }
  return key;
}
function defaultMonthData(){
  return {
    B:0,
    C:[{n:"Аренда",a:56000,h:[],col:P[0]},{n:"Транспорт",a:7000,h:[],col:P[1]},{n:"Одежда",a:15000,h:[],col:P[2]},{n:"Развлечения",a:8000,h:[],col:P[3]},{n:"Путешествия",a:20000,h:[],col:P[4]},{n:"Дети",a:30000,h:[],col:P[5]}],
    EV:[],
    IN:[]
  };
}

let STORE = { months:{}, current:null, deletedMonths:[], order:[] };
try{
  const r=localStorage.getItem(K);
  if(r){
    const p=JSON.parse(r);
    if(p && typeof p.months==='object') STORE.months=p.months;
    if(p && p.current) STORE.current=p.current;
    if(p && Array.isArray(p.deletedMonths)) STORE.deletedMonths=p.deletedMonths;
    if(p && Array.isArray(p.order)) STORE.order=p.order;
  }
}catch(e){}

const nowKey = monthKey(new Date());
if(Object.keys(STORE.months).length===0){
  STORE.months[nowKey] = defaultMonthData();
  STORE.current = nowKey;
}
if(!STORE.current || !STORE.months[STORE.current]){
  const keys = Object.keys(STORE.months).sort();
  STORE.current = keys[keys.length-1];
}

// migrate: build/repair order array so it contains exactly the existing month keys
{
  const existing = Object.keys(STORE.months);
  const known = new Set(STORE.order);
  const missing = existing.filter(k=>!known.has(k)).sort();
  STORE.order = STORE.order.filter(k=>STORE.months[k]).concat(missing);
}

// migrate old data without fixed category colors
Object.values(STORE.months).forEach(month=>{
  (month.C||[]).forEach((c,i)=>{
    if(!c.col) c.col = nextColor(month.C.slice(0,i));
  });
  if(!Array.isArray(month.IN)) month.IN = [];
});

// active month's data, aliased for convenience
function cur(){ return STORE.months[STORE.current]; }

const rowsEl=document.getElementById('rows'),svg=document.getElementById('donut'),bi=document.getElementById('bi'),st=document.getElementById('status');
const monthSelect=document.getElementById('monthSelect');

function fmt(n){return new Intl.NumberFormat('ru-RU').format(Math.round(n||0))}
function strip(v){return v.replace(/[^0-9.]/g,'').replace(/^0+(?=\d)/,'')}
function formatLiveInput(inp){
  const raw = strip(inp.value);
  const parts = raw.split('.');
  const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
  const formatted = parts.length>1 ? intPart+'.'+parts[1] : intPart;
  inp.value = formatted;
}
function numVal(v){ return parseFloat(String(v).replace(/[\u00A0\s]/g,''))||0; }
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function save(){
  try{
    localStorage.setItem(K,JSON.stringify(STORE));
    st.textContent="Сохранено ✓";
    st.classList.remove('err');
    setTimeout(()=>st.textContent='',1200);
  }catch(e){
    st.textContent="Ошибка сохранения";
    st.classList.add('err');
  }
}
let t=null;function sched(){if(t)clearTimeout(t);t=setTimeout(save,800)}
function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function pol(cx,cy,r,a){const x=a*Math.PI/180;return{x:cx+r*Math.cos(x),y:cy+r*Math.sin(x)}}
function arc(cx,cy,r,s,e){
  if(e-s>=359.999) e=s+359.999;
  const S=pol(cx,cy,r,s),E=pol(cx,cy,r,e),L=e-s<=180?0:1;
  return`M ${S.x} ${S.y} A ${r} ${r} 0 ${L} 1 ${E.x} ${E.y}`;
}

function renderMonthSelect(){
  const keys = STORE.order.filter(k=>STORE.months[k]);
  monthSelect.innerHTML = keys.map(k=>`<option value="${k}" ${k===STORE.current?'selected':''}>${monthLabel(k)}</option>`).join('');
}

function switchMonth(key){
  if(!STORE.months[key]) return;
  STORE.current = key;
  bi.value = fmt(cur().B);
  renderRows();
  renderChart();
  save();
}

function renderRows(){
  const m = cur();
  const C = m.C;
  const openHist = new Set();
  document.querySelectorAll('.hist.open').forEach(el=>openHist.add(el.id));
  const budgetTotal = parseFloat(m.B)||0;
  rowsEl.innerHTML='';
  C.forEach((c,i)=>{
    const pct=budgetTotal>0?(c.a/budgetTotal*100):0;
    const histCount=(c.h||[]).length;
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`
      <div class="row-top">
        <div class="move-col">
          <button class="drag-handle" type="button" data-drag="1" aria-label="Перетащить категорию">⠿</button>
        </div>
        <div class="sw" style="background:${c.col || P[i%P.length]}"></div>
        <input class="ninp" value="${(c.n||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="n">
        <div class="amt-display" id="amt-${i}">${fmt(c.a)}</div>
        <div class="pct">${pct.toFixed(1)}%</div>
        <button class="del" data-i="${i}">×</button>
      </div>
      <div class="row-bottom">
        <form class="plus-row" data-plusform="${i}">
          <input class="plus-input" type="text" inputmode="decimal" placeholder="сумма" data-i="${i}" data-plus="1">
          <button class="plus-btn" type="button" data-plusbtn="${i}">+</button>
        </form>
        <div class="comment-row">
          <input class="comment-input" type="text" placeholder="комментарий" data-i="${i}" data-comment="1">
          <button class="hist-icon-btn" type="button" data-i="${i}" data-histbtn="1" aria-label="История категории" title="История категории">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
            ${histCount>0?`<span class="hist-icon-badge">${histCount}</span>`:''}
          </button>
        </div>
      </div>
      <div class="hist${openHist.has('hist-'+i)?' open':''}" id="hist-${i}">
        ${(c.h||[]).map((item,hi)=>({item,hi})).reverse().map(({item,hi})=>`<div class="hist-item"><div class="hist-top"><span>${fmtDate(item.d)}</span><b>+${fmt(item.a)}</b>${item.c?`<span class="hist-comment" data-commenttoggle="1">${item.c.replace(/</g,'&lt;')}</span>`:''}<button class="hist-del" data-i="${i}" data-hi="${hi}">×</button></div></div>`).join('')}
      </div>
    `;
    row._cat = c;
    rowsEl.appendChild(row);
  });
  attach();
}

function renderChart(){

  const ld=document.getElementById('ld');ld.textContent=fmt(left);ld.classList.toggle('neg',left<0);
  svg.innerHTML='';
  const cx=150,cy=150,r=130,ri=78,ns="http://www.w3.org/2000/svg",ct=Math.max(m.B,total);
  if(ct<=0){const c=document.createElementNS(ns,"circle");c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r);c.setAttribute("fill","none");c.setAttribute("stroke",cssVar('--track'));c.setAttribute("stroke-width",r-ri);svg.appendChild(c)}
  else{
    let a=-90;
    m.C.forEach((c,i)=>{const v=parseFloat(c.a)||0;if(v<=0)return;const f=v/ct,sw=f*360;const p=arc(cx,cy,(r+ri)/2,a,a+sw);const el=document.createElementNS(ns,"path");el.setAttribute("d",p);el.setAttribute("stroke",c.col || P[i%P.length]);el.setAttribute("stroke-width",r-ri);el.setAttribute("fill","none");svg.appendChild(el);a+=sw});
    if(left>0){const f=left/ct,sw=f*360;const p=arc(cx,cy,(r+ri)/2,a,a+sw);const el=document.createElementNS(ns,"path");el.setAttribute("d",p);el.setAttribute("stroke",cssVar('--white-seg'));el.setAttribute("stroke-width",r-ri);el.setAttribute("fill","none");svg.appendChild(el)}
  }
  const t1=document.createElementNS(ns,"text");t1.setAttribute("x",cx);t1.setAttribute("y",cy+4);t1.setAttribute("text-anchor","middle");t1.setAttribute("fill",cssVar('--text'));t1.setAttribute("font-weight","800");t1.setAttribute("font-size",total>=1000000?26:32);t1.textContent=fmt(total);svg.appendChild(t1);
  const t2=document.createElementNS(ns,"text");t2.setAttribute("x",cx);t2.setAttribute("y",cy+26);t2.setAttribute("text-anchor","middle");t2.setAttribute("fill",cssVar('--muted'));t2.setAttribute("font-size","10");t2.textContent="РАСХОДЫ";svg.appendChild(t2);
}

function addExpense(i, amount, comment){
  const C = cur().C;
  if(!amount || amount<=0) return;
  C[i].a = (parseFloat(C[i].a)||0) + amount;
  if(!C[i].h) C[i].h=[];
  const entry = {a:amount, d:new Date().toISOString()};
  if(comment && comment.trim()) entry.c = comment.trim();
  C[i].h.push(entry);
  renderRows();
  renderChart();
  if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
  save();
}

function addIncome(amount, comment){
  const m = cur();
  if(!amount || amount<=0) return;
  m.B = (parseFloat(m.B)||0) + amount;
  if(!m.IN) m.IN=[];
  const entry = {a:amount, d:new Date().toISOString()};
  if(comment && comment.trim()) entry.c = comment.trim();
  m.IN.push(entry);
  bi.value = fmt(m.B);
  renderRows();
  renderChart();
  if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
  save();
}

function deleteIncome(ii){
  const m = cur();
  const entry = (m.IN||[])[ii];
  if(!entry) return;
  const label = entry.c ? `${fmt(entry.a)} (${entry.c})` : fmt(entry.a);
  if(!confirm(`Удалить доход +${label}? Бюджет уменьшится.`)) return;
  m.B = (parseFloat(m.B)||0) - (parseFloat(entry.a)||0);
  m.IN.splice(ii,1);
  bi.value = fmt(m.B);
  renderRows();
  renderChart();
  renderGlobalHist();
  save();
}

function editIncome(ii, newAmount, newComment){
  const m = cur();
  const entry = (m.IN||[])[ii];
  if(!entry) return;
  const oldAmount = parseFloat(entry.a)||0;
  const diff = (newAmount||0) - oldAmount;
  m.B = (parseFloat(m.B)||0) + diff;
  entry.a = newAmount||0;
  entry.c = newComment && newComment.trim() ? newComment.trim() : undefined;
  if(!entry.c) delete entry.c;
  bi.value = fmt(m.B);
  renderRows();
  renderChart();
  renderGlobalHist();
  save();
}

function deleteExpense(i, hi){
  const C = cur().C;
  const entry = C[i].h[hi];
  if(!entry) return;
  const label = entry.c ? `${fmt(entry.a)} (${entry.c})` : fmt(entry.a);
  if(!confirm(`Удалить трату +${label}? Сумма категории уменьшится.`)) return;
  C[i].a = (parseFloat(C[i].a)||0) - (parseFloat(entry.a)||0);
  C[i].h.splice(hi,1);

  renderChart();
  save();

function editExpense(i, hi, newAmount, newComment){

  entry.a = newAmount||0;
  entry.c = newComment && newComment.trim() ? newComment.trim() : undefined;

  renderRows();
  renderChart();

  save();
}

function getAllExpenses(){
  const m = cur();
  const all=[];
  m.C.forEach((c,ci)=>{
    (c.h||[]).forEach((item,hi)=>{
      all.push({kind:'expense', ci, hi, catName:c.n, catColor:c.col || P[ci%P.length], amount:item.a, comment:item.c, date:item.d});
    });
  });
  (m.IN||[]).forEach((item,ii)=>{
    all.push({kind:'income', ii, amount:item.a, comment:item.c, date:item.d});
  });
  (m.EV||[]).forEach((ev,evIndex)=>{
    if(ev.type==='del_cat'){
      all.push({kind:'del_cat', evIndex, catName:ev.name, amount:ev.amount, h:ev.h||[], date:ev.date, restored:!!ev.restored});
    } else if(ev.type==='add_cat'){
      all.push({kind:'add_cat', catName:ev.name, date:ev.date});
    } else if(ev.type==='rename_cat'){
      all.push({kind:'rename_cat', oldName:ev.oldName, newName:ev.newName, date:ev.date});
    }
  });
  (STORE.deletedMonths||[]).forEach((dm,dmIndex)=>{
    all.push({kind:'del_month', dmIndex, monthLabel:dm.label, date:dm.date, restored:!!dm.restored});
  });
  all.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return all;
}

function tagOf(kind){
  if(kind==='expense') return 'expense';

function attach(){
  const C = cur().C;
  document.querySelectorAll('[data-drag]').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault();
      const rowEl = handle.closest('.row');
      const cat = rowEl._cat;
      const rect = rowEl.getBoundingClientRect();
      const startY = e.clientY;
      const startTop = rect.top, startLeft = rect.left, w = rect.width, h = rect.height;
      const spacer = document.createElement('div');
      spacer.className = 'row-spacer';
      spacer.style.height = h+'px';
      rowsEl.insertBefore(spacer, rowEl);
      rowEl.style.position='fixed';
      rowEl.style.top = startTop+'px';
      rowEl.style.left = startLeft+'px';
      rowEl.style.width = w+'px';
      rowEl.style.zIndex = 1000;
      rowEl.classList.add('row-dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      function onMove(ev){
        ev.preventDefault();
        const dy = ev.clientY - startY;
        rowEl.style.top = (startTop+dy)+'px';
        const sibs = Array.from(rowsEl.children).filter(el=>el!==rowEl && el!==spacer);
        let targetEl = null;
        for(const el of sibs){
          const r = el.getBoundingClientRect();
          if(ev.clientY < r.top + r.height/2){ targetEl = el; break; }
        }
        if(targetEl){
          if(spacer.nextSibling !== targetEl) rowsEl.insertBefore(spacer, targetEl);
        } else {
          if(spacer !== rowsEl.lastElementChild) rowsEl.appendChild(spacer);
        }
      }
      function onUp(ev){
        try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        const order = Array.from(rowsEl.children).filter(el=>el!==rowEl);
        const newC = order.map(el => el===spacer ? cat : el._cat);
        cur().C = newC;
        renderRows();
        renderChart();
        sched();
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
  });
  document.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('focus',e=>{
      e.target.select();
      e.target.dataset.prevName = e.target.value;
    });
    inp.addEventListener('input',e=>{
      const i=+e.target.dataset.i;
      C[i].n=e.target.value;
      sched();
    });
    inp.addEventListener('blur',e=>{
      const i=+e.target.dataset.i;
      const before = e.target.dataset.prevName;
      const after = C[i].n;
      if(before!=null && before!==after && after && after.trim()){
        const m = cur();
        if(!m.EV) m.EV=[];
        m.EV.push({type:'rename_cat', oldName:before, newName:after, date:new Date().toISOString()});
        sched();
        if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
      }
    });
  });
  document.querySelectorAll('.del').forEach(b=>b.addEventListener('click',e=>{
    const i=+e.target.dataset.i;
    const name=C[i].n||'эту категорию';
    if(confirm(`Удалить категорию «${name}»? Это действие нельзя отменить.`)){
      const m = cur();
      if(!m.EV) m.EV=[];
      m.EV.push({type:'del_cat', name:C[i].n, amount:C[i].a, h:C[i].h||[], date:new Date().toISOString()});
      C.splice(i,1);renderRows();renderChart();sched();
      if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
    }
  }));
  document.querySelectorAll('[data-plusform]').forEach(form=>{
    form.addEventListener('submit',e=>{ e.preventDefault(); });
  });
  document.querySelectorAll('[data-plusbtn]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+btn.dataset.plusbtn;
      const inp=document.querySelector(`.plus-input[data-i="${i}"]`);
      if(!inp.classList.contains('show')){
        inp.classList.add('show');
        btn.classList.add('compact');
        inp.focus();
        return;
      }
      const val = numVal(inp.value);
      if(val<=0){
        inp.focus();
        return;
      }
      const commentInp=document.querySelector(`[data-comment][data-i="${i}"]`);
      addExpense(i, val, commentInp?commentInp.value:'');
      inp.value='';
      inp.classList.remove('show');
      btn.classList.remove('compact');
    });
  });
  document.querySelectorAll('[data-plus]').forEach(inp=>{
    inp.addEventListener('input',e=>{ formatLiveInput(e.target); });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key==='Go'||e.key==='Done'){
        e.preventDefault();
        const i=+e.target.dataset.i;
        const val = numVal(e.target.value);
        if(val<=0) return;
        const commentInp=document.querySelector(`[data-comment][data-i="${i}"]`);
        addExpense(i, val, commentInp?commentInp.value:'');
        e.target.blur();
      }
    });
  });
  document.querySelectorAll('[data-histbtn]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.target.dataset.i;
      document.getElementById('hist-'+i).classList.toggle('open');
    });
  });
  document.querySelectorAll('[data-commenttoggle]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.target.classList.toggle('expanded');
    });
  });
  document.querySelectorAll('.hist-del').forEach(btn=>{
    btn.addEventListener('click',e=>{

    });
  });
}

document.getElementById('newMonthBtn').addEventListener('click',()=>{
  const calendarKeys = Object.keys(STORE.months).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();
  const lastKey = calendarKeys.length ? calendarKeys[calendarKeys.length-1] : monthKey(new Date());
  const [y,m] = lastKey.split('-').map(Number);
  let ny=y, nm=m+1;
  if(nm>12){ nm=1; ny++; }
  const newKey = ny+'-'+String(nm).padStart(2,'0');
  if(STORE.months[newKey]){
    switchMonth(newKey);
    return;
  }
  const sourceKey = STORE.order.length ? STORE.order[STORE.order.length-1] : lastKey;
  const prev = STORE.months[sourceKey] || STORE.months[lastKey];
  const newCategories = prev.C.map(c=>({n:c.n, a:0, h:[], col:c.col || nextColor([])}));
  STORE.months[newKey] = { B: 0, C: newCategories, EV: [], IN: [] };
  STORE.order.push(newKey);
  STORE.current = newKey;
  renderMonthSelect();
  bi.value = fmt(cur().B);
  renderRows();
  renderChart();
  save();
});

document.getElementById('newCustomMonthBtn').addEventListener('click',()=>{
  const name = prompt('Название периода (например «Отпуск», «Проект X»):');
  if(!name || !name.trim()) return;
  const trimmed = name.trim();
  const key = 'c'+Date.now();
  const sourceKey = STORE.order.length ? STORE.order[STORE.order.length-1] : STORE.current;
  const prev = STORE.months[sourceKey] || cur();
  const newCategories = prev.C.map(c=>({n:c.n, a:0, h:[], col:c.col || nextColor([])}));
  STORE.months[key] = { B: 0, C: newCategories, EV: [], IN: [], customName: trimmed };
  STORE.order.push(key);
  STORE.current = key;
  renderMonthSelect();
  bi.value = fmt(cur().B);
  renderRows();
  renderChart();
  save();
});

document.getElementById('delMonthBtn').addEventListener('click',()=>{
  const keys = Object.keys(STORE.months);
  if(keys.length<=1){
    alert('Нельзя удалить единственный месяц.');
    return;
  }
  const label = monthLabel(STORE.current);
  if(!confirm(`Удалить «${label}» полностью? Категории и суммы этого месяца скроются, но их можно будет восстановить из истории.`)) return;
  const key = STORE.current;
  const data = STORE.months[key];
  STORE.deletedMonths.push({ key, label, data, date: new Date().toISOString(), restored:false });
  delete STORE.months[key];
  STORE.order = STORE.order.filter(k=>k!==key);
  const remaining = STORE.order.filter(k=>STORE.months[k]);
  STORE.current = remaining[remaining.length-1];
  renderMonthSelect();
  bi.value = fmt(cur().B);
  renderRows();
  renderChart();
  if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
  save();
});

document.getElementById('ghExport').addEventListener('click',()=>{
  const m = cur();
  const rows = [];
  m.C.forEach(c=>{
    (c.h||[]).forEach(item=>{
      rows.push({ date:item.d, cat:c.n, amount:item.a, comment:item.c||'' });
    });
  });
  rows.sort((a,b)=> new Date(a.date) - new Date(b.date));
  if(rows.length===0){
    alert('Пока нет трат для выгрузки.');
    return;
  }
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [['Дата','Категория','Сумма','Комментарий'].map(esc).join(';')];
  rows.forEach(r=>{
    const d = new Date(r.date);
    const dateStr = d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    lines.push([dateStr, r.cat, r.amount, r.comment].map(esc).join(';'));
  });
  const csv = '\uFEFF'+lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `траты-${monthLabel(STORE.current).replace(/\s+/g,'_')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

const THEME_KEY = "icity-budget-theme";
const themeBtn = document.getElementById('themeToggle');
const themeIconSun = document.getElementById('themeIconSun');
const themeIconMoon = document.getElementById('themeIconMoon');
function applyTheme(theme){
  if(theme==='light'){
    document.documentElement.setAttribute('data-theme','light');
    themeIconSun.style.display='none';
    themeIconMoon.style.display='block';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeIconSun.style.display='block';
    themeIconMoon.style.display='none';
  }
  renderChart();
}
let savedTheme = 'dark';
try{ savedTheme = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}

renderMonthSelect();
bi.value = fmt(cur().B);
renderRows();
renderChart();
applyTheme(savedTheme);

themeBtn.addEventListener('click',()=>{
  const current = document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark';
  const next = current==='light' ? 'dark' : 'light';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});
