<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
:root{--bg:#151316;--card:#1e1b1f;--line:#2c282c;--text:#f4f2f0;--muted:#8d8790;--accent:#e8c96b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}
body{padding:20px 14px;display:flex;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 16px;width:100%;max-width:560px}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px}
h1{font-weight:800;font-size:26px;margin:0}
#status{font-size:12px;color:var(--muted)}
#status.err{color:#e57373}
#saveBtn{background:var(--accent);color:#151316;border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px}
svg{overflow:visible}
.tot{display:flex;gap:20px;font-size:12px;color:var(--muted);text-align:center}
.tot b{color:var(--text);font-size:15px;display:block;margin-top:2px}
.tot b.neg{color:#e57373}
.bwrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.binp{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-weight:700;font-size:14px;padding:6px 10px;width:100px}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row-top{display:grid;grid-template-columns:12px minmax(0,1fr) 82px 44px 22px;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px}
.ninp{background:transparent;border:none;color:var(--text);font-weight:600;font-size:12px;text-transform:uppercase;width:100%;min-width:0;padding:3px 2px}
.amt-display{font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.pct{font-size:10px;color:var(--muted);text-align:right}
.del{background:none;border:none;color:var(--muted);font-size:15px;width:22px;height:22px;border-radius:6px}
.row-bottom{display:flex;align-items:center;gap:6px;margin-top:6px;padding-left:18px}
.plus-input{background:rgba(127,168,143,.12);border:1px solid #7fa88f;border-radius:10px;color:var(--text);font-size:13px;padding:9px 10px;width:100px;min-width:0;height:40px;text-align:center}
.plus-input::placeholder{color:#a8c9b4}
.comment-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:12px;padding:9px 10px;width:100%;min-width:0;height:40px;margin-top:6px}
.comment-input::placeholder{color:var(--muted)}
.plus-row{display:flex;align-items:center;gap:6px}
.plus-btn{background:#7fa88f;border:none;color:#151316;font-weight:800;font-size:18px;width:40px;height:40px;border-radius:10px;flex-shrink:0}
.hist-toggle{background:none;border:none;color:var(--muted);font-size:10px;text-decoration:underline;padding:2px 4px;flex-shrink:0}
.hist{margin-top:6px;padding-left:18px;display:none}
.hist.open{display:block}
.hist-item{display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--muted);padding:4px 0}
.hist-item .hist-top{display:flex;gap:10px;align-items:center}
.hist-item b{color:var(--text);font-weight:600}
.hist-item .hist-comment{color:var(--muted);font-size:11px;padding-left:0;font-style:italic}
.hist-del{background:none;border:none;color:var(--muted);font-size:13px;width:20px;height:20px;border-radius:5px;margin-left:auto;flex-shrink:0}
.add{margin-top:12px;background:none;border:1px dashed var(--line);color:var(--muted);font-weight:600;font-size:12px;padding:9px 12px;border-radius:12px;width:100%;text-align:left}
.globalhist-btn{margin-top:10px;background:none;border:1px solid var(--line);color:var(--text);font-weight:600;font-size:13px;padding:11px 12px;border-radius:12px;width:100%;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:85vh;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-size:18px;font-weight:800;margin:0}
.sheet-close{background:none;border:none;color:var(--muted);font-size:20px;width:32px;height:32px}
.gh-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
.gh-item{border-bottom:1px solid var(--line);padding:10px 0}
.gh-row{display:flex;align-items:center;gap:8px}
.gh-sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.gh-cat{font-size:11px;color:var(--muted);text-transform:uppercase;flex-shrink:0}
.gh-date{font-size:11px;color:var(--muted);margin-left:auto}
.gh-editrow{display:flex;align-items:center;gap:6px;margin-top:6px}
.gh-amt-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-weight:700;font-size:13px;padding:6px 8px;width:90px;text-align:center}
.gh-comment-input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 8px;flex:1;min-width:0}
.gh-save{background:#7fa88f;border:none;color:#151316;font-weight:700;font-size:12px;padding:7px 10px;border-radius:8px;flex-shrink:0}
.gh-del{background:none;border:none;color:var(--muted);font-size:14px;width:26px;height:26px;border-radius:6px;flex-shrink:0}
</style></head><body><div class="card">
<div class="head"><h1>Бюджет</h1><div style="display:flex;align-items:center;gap:8px"><span id="status"></span><button id="saveBtn">Сохранить</button></div></div>
<div class="chart-col">
<svg id="donut" width="220" height="220" viewBox="0 0 300 300"></svg>
<div class="tot"><div>Бюджет<b id="bd">-</b></div><div>Остаток<b id="ld">-</b></div></div>
<div class="bwrap">Бюджет<input class="binp" id="bi" type="text" inputmode="decimal" value="300000"></div>
</div>
<div id="rows"></div>
<button class="add" id="addRow">+ Добавить категорию</button>
<button class="globalhist-btn" id="openGlobalHist">История всех трат</button>
</div>
<div class="overlay" id="ghOverlay">
  <div class="sheet">
    <div class="sheet-head"><h2>История трат</h2><button class="sheet-close" id="ghClose">×</button></div>
    <div id="ghList"></div>
  </div>
</div>
<script>
const P=["#e8c96b","#c97b5c","#7fa88f","#6f8fc9","#b47fc9","#d98fa0","#8fb4d9","#c9a87f","#9fc97f","#c97fa8","#7fc9c0","#c9c07f"];
const K="icity-budget-v1";
let B=300000,C=[{n:"Аренда",a:56000,h:[]},{n:"Транспорт",a:7000,h:[]},{n:"Одежда",a:15000,h:[]},{n:"Развлечения",a:8000,h:[]},{n:"Путешествия",a:20000,h:[]},{n:"Дети",a:30000,h:[]}];
try{
  const r=localStorage.getItem(K);
  if(r){
    const p=JSON.parse(r);
    if(p.B!=null)B=p.B;
    if(Array.isArray(p.C))C=p.C.map(c=>({n:c.n,a:c.a,h:Array.isArray(c.h)?c.h:[]}));
  }
}catch(e){}
const rowsEl=document.getElementById('rows'),svg=document.getElementById('donut'),bi=document.getElementById('bi'),st=document.getElementById('status'),sb=document.getElementById('saveBtn');
function fmt(n){return new Intl.NumberFormat('ru-RU').format(Math.round(n||0))}
function strip(v){return v.replace(/[^0-9.]/g,'').replace(/^0+(?=\d)/,'')}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function save(){try{localStorage.setItem(K,JSON.stringify({B,C}));st.textContent="Сохранено ✓";st.classList.remove('err');setTimeout(()=>st.textContent='',1500)}catch(e){st.textContent="Ошибка";st.classList.add('err')}}
let t=null;function sched(){if(t)clearTimeout(t);t=setTimeout(save,800)}
function pol(cx,cy,r,a){const x=a*Math.PI/180;return{x:cx+r*Math.cos(x),y:cy+r*Math.sin(x)}}
function arc(cx,cy,r,s,e){const S=pol(cx,cy,r,s),E=pol(cx,cy,r,e),L=e-s<=180?0:1;return`M ${S.x} ${S.y} A ${r} ${r} 0 ${L} 1 ${E.x} ${E.y}`}

function renderRows(){
  const openHist = new Set();
  document.querySelectorAll('.hist.open').forEach(el=>openHist.add(el.id));
  const total=C.reduce((s,c)=>s+(parseFloat(c.a)||0),0);
  rowsEl.innerHTML='';
  C.forEach((c,i)=>{
    const pct=total>0?(c.a/total*100):0;
    const histCount=(c.h||[]).length;
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`
      <div class="row-top">
        <div class="sw" style="background:${P[i%P.length]}"></div>
        <input class="ninp" value="${(c.n||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="n">
        <div class="amt-display" id="amt-${i}">${fmt(c.a)}</div>
        <div class="pct">${pct.toFixed(1)}%</div>
        <button class="del" data-i="${i}">×</button>
      </div>
      <div class="row-bottom">
        <div class="plus-row">
          <input class="plus-input" type="text" inputmode="decimal" placeholder="добавить" data-i="${i}" data-plus="1">
          <button class="plus-btn" data-i="${i}" data-addbtn="1">+</button>
          ${histCount>0?`<button class="hist-toggle" data-i="${i}" data-histbtn="1">история (${histCount})</button>`:''}
        </div>
        <input class="comment-input" type="text" placeholder="комментарий (необязательно)" data-i="${i}" data-comment="1">
      </div>
      <div class="hist${openHist.has('hist-'+i)?' open':''}" id="hist-${i}">
        ${(c.h||[]).map((item,hi)=>({item,hi})).reverse().map(({item,hi})=>`<div class="hist-item"><div class="hist-top"><span>${fmtDate(item.d)}</span><b>+${fmt(item.a)}</b><button class="hist-del" data-i="${i}" data-hi="${hi}">×</button></div>${item.c?`<div class="hist-comment">${item.c.replace(/</g,'&lt;')}</div>`:''}</div>`).join('')}
      </div>
    `;
    rowsEl.appendChild(row);
  });
  attach();
}

function renderChart(){
  const total=C.reduce((s,c)=>s+(parseFloat(c.a)||0),0),left=B-total;
  document.getElementById('bd').textContent=fmt(B);
  const ld=document.getElementById('ld');ld.textContent=fmt(left);ld.classList.toggle('neg',left<0);
  svg.innerHTML='';
  const cx=150,cy=150,r=130,ri=78,ns="http://www.w3.org/2000/svg",ct=Math.max(B,total);
  if(ct<=0){const c=document.createElementNS(ns,"circle");c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r);c.setAttribute("fill","none");c.setAttribute("stroke","#2c282c");c.setAttribute("stroke-width",r-ri);svg.appendChild(c)}
  else{
    let a=-90;
    C.forEach((c,i)=>{const v=parseFloat(c.a)||0;if(v<=0)return;const f=v/ct,sw=f*360;const p=arc(cx,cy,(r+ri)/2,a,a+sw);const el=document.createElementNS(ns,"path");el.setAttribute("d",p);el.setAttribute("stroke",P[i%P.length]);el.setAttribute("stroke-width",r-ri);el.setAttribute("fill","none");svg.appendChild(el);a+=sw});
    if(left>0){const f=left/ct,sw=f*360;const p=arc(cx,cy,(r+ri)/2,a,a+sw);const el=document.createElementNS(ns,"path");el.setAttribute("d",p);el.setAttribute("stroke","#f4f2f0");el.setAttribute("stroke-width",r-ri);el.setAttribute("fill","none");svg.appendChild(el)}
  }
  const t1=document.createElementNS(ns,"text");t1.setAttribute("x",cx);t1.setAttribute("y",cy-4);t1.setAttribute("text-anchor","middle");t1.setAttribute("fill","#f4f2f0");t1.setAttribute("font-weight","800");t1.setAttribute("font-size",total>=1000000?26:32);t1.textContent=fmt(total);svg.appendChild(t1);
  const t2=document.createElementNS(ns,"text");t2.setAttribute("x",cx);t2.setAttribute("y",cy+18);t2.setAttribute("text-anchor","middle");t2.setAttribute("fill","#8d8790");t2.setAttribute("font-size","10");t2.textContent="РАСХОДЫ";svg.appendChild(t2);
}

function pctAndAmountOnly(){
  const total=C.reduce((s,c)=>s+(parseFloat(c.a)||0),0);
  document.querySelectorAll('.pct').forEach((el,i)=>{
    const v=parseFloat(C[i].a)||0;
    el.textContent=(total>0?(v/total*100):0).toFixed(1)+'%';
  });
  C.forEach((c,i)=>{
    const el=document.getElementById('amt-'+i);
    if(el) el.textContent=fmt(c.a);
  });
}

function addExpense(i, amount, comment){
  if(!amount || amount<=0) return;
  C[i].a = (parseFloat(C[i].a)||0) + amount;
  if(!C[i].h) C[i].h=[];
  const entry = {a:amount, d:new Date().toISOString()};
  if(comment && comment.trim()) entry.c = comment.trim();
  C[i].h.push(entry);
  renderRows();
  renderChart();
  if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
  save();
}

function deleteExpense(i, hi){
  const entry = C[i].h[hi];
  if(!entry) return;
  const label = entry.c ? `${fmt(entry.a)} (${entry.c})` : fmt(entry.a);
  if(!confirm(`Удалить трату +${label}? Сумма категории уменьшится.`)) return;
  C[i].a = (parseFloat(C[i].a)||0) - (parseFloat(entry.a)||0);
  C[i].h.splice(hi,1);
  renderRows();
  renderChart();
  save();
}

function editExpense(i, hi, newAmount, newComment){
  const entry = C[i].h[hi];
  if(!entry) return;
  const oldAmount = parseFloat(entry.a)||0;
  const diff = (newAmount||0) - oldAmount;
  C[i].a = (parseFloat(C[i].a)||0) + diff;
  entry.a = newAmount||0;
  entry.c = newComment && newComment.trim() ? newComment.trim() : undefined;
  if(!entry.c) delete entry.c;
  renderRows();
  renderChart();
  renderGlobalHist();
  save();
}

function getAllExpenses(){
  const all=[];
  C.forEach((c,ci)=>{
    (c.h||[]).forEach((item,hi)=>{
      all.push({ci, hi, catName:c.n, catColor:P[ci%P.length], amount:item.a, comment:item.c, date:item.d});
    });
  });
  all.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return all;
}

let ghEditing = null; // {ci, hi}

function renderGlobalHist(){
  const ghList = document.getElementById('ghList');
  const all = getAllExpenses();
  if(all.length===0){
    ghList.innerHTML = '<div class="gh-empty">Пока нет добавленных трат</div>';
    return;
  }
  ghList.innerHTML = all.map(item=>{
    const isEditing = ghEditing && ghEditing.ci===item.ci && ghEditing.hi===item.hi;
    return `
      <div class="gh-item">
        <div class="gh-row">
          <div class="gh-sw" style="background:${item.catColor}"></div>
          <div class="gh-cat">${(item.catName||'').replace(/</g,'&lt;')}</div>
          <div class="gh-date">${fmtDate(item.date)}</div>
        </div>
        ${isEditing ? `
          <div class="gh-editrow">
            <input class="gh-amt-input" type="text" inputmode="decimal" value="${item.amount}" data-ghamt="1">
            <input class="gh-comment-input" type="text" placeholder="комментарий" value="${(item.comment||'').replace(/"/g,'&quot;')}" data-ghcomment="1">
          </div>
          <div class="gh-editrow">
            <button class="gh-save" data-ghsave="${item.ci}:${item.hi}">Сохранить</button>
            <button class="gh-del" data-ghdel="${item.ci}:${item.hi}">Удалить</button>
          </div>
        ` : `
          <div class="gh-editrow" style="justify-content:space-between">
            <div style="font-weight:700">+${fmt(item.amount)}${item.comment?` <span style="color:var(--muted);font-weight:400;font-style:italic">— ${item.comment.replace(/</g,'&lt;')}</span>`:''}</div>
            <button class="gh-del" data-ghedit="${item.ci}:${item.hi}" style="color:var(--accent)">✎</button>
          </div>
        `}
      </div>
    `;
  }).join('');
  attachGlobalHist();
}

function attachGlobalHist(){
  document.querySelectorAll('[data-ghedit]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const [ci,hi] = e.target.dataset.ghedit.split(':').map(Number);
      ghEditing = {ci, hi};
      renderGlobalHist();
    });
  });
  document.querySelectorAll('[data-ghamt]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const cleaned=strip(e.target.value);
      if(cleaned!==e.target.value) e.target.value=cleaned;
    });
  });
  document.querySelectorAll('[data-ghsave]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const [ci,hi] = e.target.dataset.ghsave.split(':').map(Number);
      const amtInp = document.querySelector('[data-ghamt]');
      const commentInp = document.querySelector('[data-ghcomment]');
      editExpense(ci, hi, parseFloat(amtInp.value)||0, commentInp.value);
      ghEditing = null;
    });
  });
  document.querySelectorAll('[data-ghdel]').forEach(btn=>{
    if(!btn.dataset.ghdel) return;
    btn.addEventListener('click',e=>{
      const [ci,hi] = e.target.dataset.ghdel.split(':').map(Number);
      const entry = C[ci].h[hi];
      if(!entry) return;
      const label = entry.c ? `${fmt(entry.a)} (${entry.c})` : fmt(entry.a);
      if(!confirm(`Удалить трату +${label}? Сумма категории уменьшится.`)) return;
      C[ci].a = (parseFloat(C[ci].a)||0) - (parseFloat(entry.a)||0);
      C[ci].h.splice(hi,1);
      ghEditing = null;
      renderRows();
      renderChart();
      renderGlobalHist();
      save();
    });
  });
}

document.getElementById('openGlobalHist').addEventListener('click',()=>{
  ghEditing = null;
  renderGlobalHist();
  document.getElementById('ghOverlay').classList.add('open');
});
document.getElementById('ghClose').addEventListener('click',()=>{
  document.getElementById('ghOverlay').classList.remove('open');
});
document.getElementById('ghOverlay').addEventListener('click',e=>{
  if(e.target.id==='ghOverlay') document.getElementById('ghOverlay').classList.remove('open');
});

function attach(){
  document.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const i=+e.target.dataset.i;
      C[i].n=e.target.value;
      sched();
    });
    inp.addEventListener('focus',e=>e.target.select());
  });
  document.querySelectorAll('.del').forEach(b=>b.addEventListener('click',e=>{
    const i=+e.target.dataset.i;
    const name=C[i].n||'эту категорию';
    if(confirm(`Удалить категорию «${name}»? Это действие нельзя отменить.`)){
      C.splice(i,1);renderRows();renderChart();sched();
    }
  }));
  document.querySelectorAll('[data-plus]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const cleaned=strip(e.target.value);
      if(cleaned!==e.target.value) e.target.value=cleaned;
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        const i=+e.target.dataset.i;
        const commentInp=document.querySelector(`[data-comment][data-i="${i}"]`);
        addExpense(i, parseFloat(e.target.value)||0, commentInp?commentInp.value:'');
      }
    });
  });
  document.querySelectorAll('[data-addbtn]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.target.dataset.i;
      const inp=document.querySelector(`[data-plus][data-i="${i}"]`);
      const commentInp=document.querySelector(`[data-comment][data-i="${i}"]`);
      addExpense(i, parseFloat(inp.value)||0, commentInp?commentInp.value:'');
    });
  });
  document.querySelectorAll('[data-histbtn]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.target.dataset.i;
      document.getElementById('hist-'+i).classList.toggle('open');
    });
  });
  document.querySelectorAll('.hist-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const i=+e.target.dataset.i, hi=+e.target.dataset.hi;
      deleteExpense(i, hi);
      if(document.getElementById('ghOverlay').classList.contains('open')) renderGlobalHist();
    });
  });
}

document.getElementById('addRow').addEventListener('click',()=>{C.push({n:"Новая категория",a:0,h:[]});renderRows();renderChart();sched()});
bi.value=String(B);
bi.addEventListener('focus',e=>e.target.select());
bi.addEventListener('input',e=>{const cl=strip(e.target.value);if(cl!==e.target.value)e.target.value=cl;B=parseFloat(cl)||0;renderChart();sched()});
bi.addEventListener('blur',()=>{bi.value=String(B)});
sb.addEventListener('click',save);
renderRows();renderChart();
</script></body></html>
